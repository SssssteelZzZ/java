# =============================================================================
#  tv_packages.conf — списки пакетов для оптимизации Haier Android TV PRO
# =============================================================================
#  Этот файл подключается (source) остальными скриптами.
#  Здесь НЕТ исполняемого кода — только массивы с именами пакетов и шаблонами.
#
#  КАК ЭТО РАБОТАЕТ:
#   1. PROTECTED_PACKAGES — «белый список». Эти пакеты скрипт не тронет НИКОГДА,
#      даже если они случайно попадут под шаблон из BLOAT_PATTERNS.
#      Это защита от «кирпича»: без них ТВ не загрузится / не будет пульта / Wi-Fi.
#   2. BLOAT_SAFE — конкретные пакеты, которые почти всегда мусор (VOD-витрины,
#      демо-приложения, промо-каталоги). Удаляются в обычном режиме.
#   3. BLOAT_GOOGLE — сервисы Google, которые жрут ОЗУ и CPU в фоне.
#      Отключать МОЖНО, но часть функций пропадёт (голосовой поиск, Ассистент).
#      Включаются только с флагом --google.
#   4. BLOAT_PATTERNS — регулярки для авто-поиска рекламы/телеметрии, которую
#      я не могу знать заранее (у каждой прошивки свои «сюрпризы»).
#      Всё найденное по шаблону скрипт покажет и спросит подтверждение.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. ЗАЩИЩЁННЫЕ ПАКЕТЫ — НИКОГДА не удалять и не отключать
# -----------------------------------------------------------------------------
# Проверка идёт по префиксу: строка "com.android.providers" защитит и
# com.android.providers.media, и com.android.providers.settings и т.д.
PROTECTED_PACKAGES=(
  # --- ядро системы: без этого телевизор не включится ---
  "android"                              # базовый системный пакет (framework-res)
  "com.android.systemui"                 # системный интерфейс: панели, уведомления
  "com.android.settings"                 # настройки
  "com.android.tv.settings"              # настройки Android TV
  "com.android.shell"                    # оболочка, через неё работает сам ADB
  "com.android.providers"                # провайдеры данных (медиа, настройки, контакты)
  "com.android.server"                   # системные сервисы
  "com.android.se"                       # secure element
  "com.android.keychain"                 # хранилище сертификатов

  # --- лаунчеры: удалишь — получишь чёрный экран вместо главного меню ---
  "com.google.android.tvlauncher"        # классический лаунчер Android TV
  "com.google.android.apps.tv.launcherx" # лаунчер Google TV (новый)
  "com.google.android.leanbacklauncher"  # старый leanback-лаунчер
  "com.android.tv.frameworkpackagestubs" # заглушки для отсутствующих компонентов

  # --- магазин и сервисы Google: снесёшь — перестанут работать все приложения ---
  "com.android.vending"                  # Google Play Store
  "com.google.android.gms"               # Google Play Services (ядро всех сервисов)
  "com.google.android.gsf"               # Google Services Framework
  "com.google.android.webview"           # системный WebView — без него падают приложения
  "com.android.webview"                  # тот же WebView в другой сборке

  # --- сеть и пульт: без этого не подключишься и не сможешь управлять ---
  "com.android.wifi"                     # Wi-Fi стек
  "com.android.networkstack"             # сетевой стек
  "com.android.captiveportallogin"       # вход в публичные сети
  "com.android.bluetooth"                # Bluetooth (пульт, наушники)
  "com.google.android.tv.remote"         # сервис пульта Android TV (и .service, и pairing)
  "com.google.android.tv.bugreportsender"# безвредный, но трогать смысла нет
  "com.android.inputmethod"              # экранная клавиатура (ввод паролей Wi-Fi!)
  "com.google.android.inputmethod"       # Gboard для TV
  "com.google.android.tvpermission"      # выдача разрешений на TV

  # --- железо и драйверы вендора: удаление ломает видео/звук/тюнер ---
  "com.mediatek"                         # чипсет MediaTek (у Haier чаще всего он)
  "com.amlogic"                          # чипсет Amlogic
  "com.realtek"                          # чипсет Realtek
  "com.haier"                            # вендорные службы Haier (панель, тюнер, HDMI)
  "com.tv.setting"                       # вендорные настройки картинки/звука
  "com.android.tv.dvr"                   # запись эфира
  "com.droidlogic"                       # системные службы Amlogic (тюнер, HDMI-CEC)
)


# -----------------------------------------------------------------------------
# 2. МУСОР, КОТОРЫЙ БЕЗОПАСНО УДАЛЯТЬ (VOD-витрины и промо-приложения)
# -----------------------------------------------------------------------------
# Это предустановленные каталоги фильмов и партнёрские приложения.
# Они висят в фоне, тянут баннеры/рекомендации по сети и едят ОЗУ.
# Любое из них при желании ставится обратно из Google Play.
BLOAT_SAFE=(
  # --- российские онлайн-кинотеатры (предустановлены по партнёрке) ---
  "ru.ivi.client"                    # IVI
  "ru.more.play"                     # MORE.TV
  "ru.okko.tv"                       # Okko
  "ru.rt.video.app.tv"               # Wink (Ростелеком)
  "com.megogo.application"           # MEGOGO
  "com.megogo.tv"                    # MEGOGO (сборка для ТВ)
  "ru.kinopoisk.yandex.tv"           # Кинопоиск
  "ru.start.androidtv"               # START
  "com.mts.mtstv"                    # KION (МТС)
  "one.premier.androidtv"            # PREMIER
  "ru.tricolor.tv"                   # Триколор Кино и ТВ
  "com.viju.androidtv"               # viju
  "tv.peers.android"                 # Peers.TV
  "ru.limehd.tv"                     # Лайм HD TV
  "ru.mts.mtstv"                     # МТС ТВ
  "ru.beeline.services"              # сервисы Билайн
  "com.spb.tv.sbt"                   # СПБ ТВ

  # --- зарубежные витрины (в РФ всё равно не работают) ---
  "com.netflix.ninja"                # Netflix
  "com.netflix.partner.activation"   # активатор кнопки Netflix на пульте
  "com.amazon.amazonvideo.livingroom"# Prime Video
  "com.amazon.aiv.eu"                # Prime Video (EU)
  "com.disney.disneyplus"            # Disney+
  "com.spotify.tv.android"           # Spotify для ТВ
  "com.plexapp.android"              # Plex
  "com.wolfgang.android.tv"          # партнёрская демка

  # --- демо/промо от производителя панели ---
  "com.android.dreams.basic"         # заставка-часы (лишний процесс)
  "com.google.android.dreamliner"    # док-режим, на ТВ бесполезен
)


# -----------------------------------------------------------------------------
# 3. СЕРВИСЫ GOOGLE — отключаются ТОЛЬКО с флагом --google
# -----------------------------------------------------------------------------
# Формат: "пакет|что именно потеряешь"
# Дают заметный прирост (минус фоновые процессы и сетевые опросы),
# но каждый из них что-то отключает. Читай второй столбец перед запуском.
BLOAT_GOOGLE=(
  "com.google.android.play.games|Play Игры — только каталог игр, на скорость влияет только в минус"
  "com.google.android.videos|Google TV Фильмы — витрина платного кино"
  "com.google.android.youtube.tvmusic|YouTube Music для ТВ"
  "com.google.android.apps.tachyon|Google Meet/Duo — видеозвонки, на ТВ почти не нужны"
  "com.google.android.katniss|Голосовой поиск и Ассистент — самый прожорливый фоновый процесс"
  "com.google.android.tvrecommendations|Рекомендации на главном экране (рекламные строки)"
  "com.google.android.backuptransport|Бэкап настроек в облако Google"
  "com.google.android.feedback|Отправка отчётов об ошибках в Google"
  "com.google.android.partnersetup|Партнёрская настройка/аналитика оператора"
  "com.google.android.printservice.recommendation|Поиск принтеров — на ТВ бесполезно"
  "com.google.android.syncadapters.contacts|Синхронизация контактов"
  "com.google.android.syncadapters.calendar|Синхронизация календаря"
  "com.google.android.marvin.talkback|TalkBack — озвучка для незрячих, висит в памяти"
  "com.google.android.tts|Синтез речи (нужен только Ассистенту и TalkBack)"
  "com.google.android.gms.location.history|История местоположений"
)


# -----------------------------------------------------------------------------
# 4. ШАБЛОНЫ АВТОПОИСКА РЕКЛАМЫ И ТЕЛЕМЕТРИИ
# -----------------------------------------------------------------------------
# Регулярные выражения (grep -E). Скрипт прогонит по ним ВЕСЬ список пакетов
# телевизора и покажет находки — потому что в каждой прошивке свои рекламные
# модули, заранее их имена знать невозможно.
# Ничего не удаляется без твоего подтверждения.
BLOAT_PATTERNS=(
  "\.ads?($|\.)"          # ...ads / ...ad. — рекламные SDK
  "adservice"             # рекламные сервисы
  "advertis"              # advertising / advertisement
  "analytics"             # аналитика и сбор статистики
  "telemetry"             # телеметрия
  "\.tracker($|\.)"       # трекеры
  "facebook\.(system|appmanager|services)" # скрытые стабы Facebook, работают в фоне
  "com\.aliexpress"       # партнёрский AliExpress
  "com\.alibaba"          # партнёрские сервисы Alibaba
  "cmcm|cheetah"          # Cheetah Mobile — классический рекламный мусор
  "\.promo($|\.)"         # промо-приложения
  "\.demo($|\.)"          # демо-режим магазина (шоурум), жрёт ресурсы
  "retail(mode|demo)"     # режим витрины магазина
)
